<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Kids Quiz{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background: #f0f8ff; }
        h1 { color: #2c3e50; }
        p { font-size: 18px; }
        a { display: inline-block; margin-top: 20px; padding: 12px 30px; background: #2ecc71; color: white; text-decoration: none; border-radius: 5px; font-size: 18px; }
        .nav { margin-bottom: 20px; }
        .nav a { background: #3498db; padding: 8px 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/about">About</a>
    </div>
    {% block content %}{% endblock %}
</body>
</html>
